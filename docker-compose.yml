services:
  farmacias-abc:
    build: .
    container_name: farmacias-abc
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@farmacia.mx}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configura ADMIN_PASSWORD en el archivo .env}
    volumes:
      - farmacia_abc_data:/data

volumes:
  farmacia_abc_data:
